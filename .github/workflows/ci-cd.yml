name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'taskops-api' }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER || 'taskops-cluster' }}
  K8S_NAMESPACE: taskops

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/taskops
      - run: helm template taskops helm/taskops --set ingress.enabled=true --set serviceMonitor.enabled=true

  build:
    name: Build & Push Image
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Only push on main when the AWS role is configured, so forks/PRs still go green.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PUBLISH == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        run: echo "name=${{ steps.ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Helm upgrade
        run: |
          helm upgrade --install taskops helm/taskops \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            --set image.repository="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY" \
            --set image.tag="${{ github.sha }}" \
            --atomic --wait --timeout 5m

      - name: Verify rollout
        run: kubectl rollout status deployment/taskops -n "$K8S_NAMESPACE"
